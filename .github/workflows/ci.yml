name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 백엔드 ──────────────────────────────────────
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aws-monitor/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check imports & syntax
        run: python -c "import main"

      - name: Build Docker image
        run: docker build -t aws-monitor-backend:ci .

  # ── 프론트엔드 ──────────────────────────────────
  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aws-monitor/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: aws-monitor/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Build Docker image
        run: docker build -t aws-monitor-frontend:ci .

  # ── Docker Compose 통합 검증 ────────────────────
  integration:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: docker compose up -d --build backend prometheus
        working-directory: aws-monitor

      - name: Wait for backend health
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/health; then
              echo "Backend healthy"
              exit 0
            fi
            sleep 3
          done
          docker compose logs backend
          exit 1
        working-directory: aws-monitor

      - name: Check /metrics endpoint
        run: curl -sf http://localhost:8000/metrics | grep http_requests_total

      - name: Teardown
        if: always()
        run: docker compose down -v
        working-directory: aws-monitor
